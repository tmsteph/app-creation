name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests
      - run: python compiler.py examples/garage.human -o build/garage.py
      - run: python -m py_compile build/garage.py
      - run: python benchmark.py
